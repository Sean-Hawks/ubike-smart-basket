; 智慧 Ubike 籃子 — PlatformIO 設定
;
; env 一覽：
;   native        電腦上的單元測試（pio test -e native）與終端機模擬器（pio run -e native）
;   esp32dev      主程式（核心邏輯 + 真實驅動 + 網頁）
;   hwtest_*      每個零件一支獨立測試程式，結果印到序列埠（115200）
;
; 換板子：只要改 [esp32_base] 的 board（腳位在 include/Pins.h）。
; 沒有 default_envs：`pio run` 會編譯全部 env；測試請用 `pio test -e native`。

; ---------------------------------------------------------------------------
; 電腦端：單元測試 + 模擬器
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
build_src_filter = -<*> +<sim/>

; ---------------------------------------------------------------------------
; ESP32 共用設定
; ---------------------------------------------------------------------------
[esp32_base]
; espressif32 6.12.0 內建 Arduino core 2.0.17（LEDC 用 2.x API）。鎖版本避免 API 突然改變。
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Arduino ESP32 2.0.17 未定義 WIRE_INTERFACES_COUNT；明確啟用 U8g2 的 Wire1 傳送函式。
build_flags = -std=gnu++17 -Iinclude -DU8X8_HAVE_2ND_HW_I2C
build_unflags = -std=gnu++11
lib_deps =
    olikraus/U8g2@^2.35.30
    adafruit/Adafruit PN532@^1.3.3
    pololu/VL53L0X@^1.3.1
    bogde/HX711@^0.7.5

[env:esp32dev]
extends = esp32_base
build_src_filter = -<*> +<main/>
; Wi-Fi + 網頁伺服器比較大，用 3MB app 分割表（不做 OTA；Preferences 的 NVS 仍保留）
board_build.partitions = huge_app.csv

[env:esp32dev_web]
extends = env:esp32dev
build_flags = ${esp32_base.build_flags} -DBASKET_WEB_DISPLAY

[env:esp32dev_web_ir32]
extends = env:esp32dev_web
build_flags = ${env:esp32dev_web.build_flags} -DBASKET_IR_MONITOR -DBASKET_IR_RX_32

[env:esp32dev_web_tof_test]
extends = env:esp32dev_web
build_flags = ${env:esp32dev_web.build_flags} -DBASKET_TOF_TEST

[env:esp32dev_web_tof_ir34]
extends = env:esp32dev_web_tof_test
build_flags = ${env:esp32dev_web_tof_test.build_flags} -DBASKET_IR_MONITOR

[env:esp32dev_web_tof_ir32]
extends = env:esp32dev_web_tof_ir34
build_flags = ${env:esp32dev_web_tof_ir34.build_flags} -DBASKET_IR_RX_32

; ---------------------------------------------------------------------------
; 單一零件測試（每支只測一個零件）
; ---------------------------------------------------------------------------
[env:hwtest_oled]
extends = esp32_base
build_src_filter = -<*> +<hwtest/oled.cpp>

[env:hwtest_nfc]
extends = esp32_base
build_src_filter = -<*> +<hwtest/nfc.cpp>

[env:hwtest_tof]
extends = esp32_base
build_src_filter = -<*> +<hwtest/tof.cpp>

[env:hwtest_hx711]
extends = esp32_base
build_src_filter = -<*> +<hwtest/hx711.cpp>

[env:hwtest_buzzer]
extends = esp32_base
build_src_filter = -<*> +<hwtest/buzzer.cpp>

[env:hwtest_ir]
extends = esp32_base
build_src_filter = -<*> +<hwtest/ir.cpp>

[env:hwtest_lock]
extends = esp32_base
build_src_filter = -<*> +<hwtest/lock.cpp>

[env:hwtest_inputs]
; 蓋子開關 + 開蓋按鈕
extends = esp32_base
build_src_filter = -<*> +<hwtest/inputs.cpp>
